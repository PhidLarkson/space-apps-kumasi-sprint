<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font-family:system-ui,sans-serif;margin:0;padding:16px;color:#07173f;background:#07173f;color:#fff}
.b{background:#eafe07;color:#07173f;border-radius:12px;padding:14px;font-size:22px;font-weight:800}</style></head>
<body>
<h3>Team 6 (test): Mars score</h3>
<div class="b" id="s">Calculating...</div>
<script>
fetch("https://power.larc.nasa.gov/api/temporal/monthly/point?parameters=T2M,PRECTOTCORR&community=RE&longitude=-68.2&latitude=-22.9&start=2025&end=2025&format=JSON")
.then(r=>r.json()).then(d=>{const p=d.properties.parameter;const t=p.T2M["202513"],r=p.PRECTOTCORR["202513"];
const score=Math.max(0,Math.round(100-(t>0?t*2:0)-r*40));
document.getElementById("s").textContent="Atacama Mars score: "+score+"/100 (temp "+t.toFixed(1)+" C, rain "+r.toFixed(2)+" mm/day)";});
</script>
</body></html>
